- id: earthbag-superadobe
  name: Earthbag / SuperAdobe
  family: earth
  costPerSqFt: "Material sourcing and substantial labour both count"
  insulation: "Thermal mass is not the same as insulation"
  diy: high
  light: opaque
  durability: "Mix, reinforcement, foundations and moisture protection matter"
  bestUse: "A hands-on earthen-building project with appropriate expertise"
  pros:
    - "CalEarth provides training and builder resources"
    - "A specific cement-stabilized SuperAdobe system has an evaluation report"
  cons:
    - "Filling, tamping and finishing can require considerable labour"
    - "Climate, water management and thermal design remain essential"
  caveats:
    - "The evaluation applies to its specified system and conditions, not every earthbag building. CalEarth calls for professionally stamped drawings; confirm local acceptance."
