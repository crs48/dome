# Qualitative reading guide. No universal prices, R-values or lifespan rankings.
- id: aircrete
  name: Aircrete (foamed cement)
  family: concrete
  costPerSqFt: "Price the complete reinforced and finished system"
  insulation: "Depends on density, moisture and assembly; request test data"
  diy: high
  light: opaque
  durability: "Detail reinforcement, weather protection and repair"
  bestUse: "Exploring a sculptable, owner-builder approach"
  pros:
    - "Cement mixed with foam creates a lightweight, shapeable material"
    - "Domegaia offers workshops, equipment and design support"
  cons:
    - "Mix quality, reinforcement and curing require care"
    - "Raw-material costs omit foundations, services, finishes and labour"
  caveats:
    - "Do not transfer a marketed R-value or strength claim to a different mix or shell. Ask for relevant tests and an engineered design."
  vendorUrl: "https://domegaia.com/"
  sources: ["https://domegaia.com/"]

- id: shotcrete-monolithic
  name: Insulated monolithic concrete
  family: concrete
  costPerSqFt: "Get an itemized local design-and-build quote"
  insulation: "Insulation layer and concrete mass do different jobs"
  diy: low
  light: opaque
  durability: "Depends on the designed assembly and maintenance"
  bestUse: "A professionally engineered permanent shell"
  pros:
    - "A continuous reinforced shell is an alternative to panel-by-panel construction"
    - "Established builders show completed homes and larger buildings"
  cons:
    - "Specialist forming, reinforcement and spraying work"
    - "Windows, entrances and services still need careful details"
  caveats:
    - "A dome is not automatically a FEMA-criteria safe room. Verify the complete design, openings, anchorage and applicable hazard criteria."
  vendorUrl: "https://www.monolithic.org/"
  sources:
    - "https://www.monolithic.org/"
    - "https://www.fema.gov/sites/default/files/documents/building-safe-room-home-small-business.pdf"

- id: timber-geodesic
  name: Timber geodesic
  family: timber
  costPerSqFt: "Compare framing kit, shell kit and finished house separately"
  insulation: "Can accommodate insulation; ask for whole-assembly performance"
  diy: high
  light: opaque
  durability: "Keep the timber dry; make the covering maintainable"
  bestUse: "A home using familiar carpentry and insulated panels"
  pros:
    - "Suppliers offer framing, insulation and finishing systems"
    - "Windows can be placed within an otherwise insulated envelope"
  cons:
    - "Many junctions need a coordinated roofing and flashing strategy"
    - "Triangular surfaces and curved edges complicate some interior details"
  caveats:
    - "Owner involvement can change paid labour costs, but it does not remove the need for skills, approvals or professional work."
  vendorUrl: "https://naturalspacesdomes.com/dome-system/pricing-and-planning/"
  sources: ["https://naturalspacesdomes.com/dome-system/pricing-and-planning/"]

- id: polycarbonate-geodesic
  name: Polycarbonate geodesic
  family: glazed
  costPerSqFt: "Check size, glazing specification and kit exclusions"
  insulation: "Varies with the exact multiwall product and framing"
  diy: high
  light: translucent
  durability: "Ask about UV protection, warranty and replacement panels"
  bestUse: "A growing space or carefully designed sunspace"
  pros:
    - "Translucent multiwall panels admit diffuse daylight"
    - "Greenhouse suppliers offer purpose-designed kits"
  cons:
    - "Ventilation and shade matter for summer growing conditions"
    - "Winter heating needs depend on climate and intended crops"
  caveats:
    - "A greenhouse enclosure is not evidence of a complete year-round dwelling envelope or permission to live in it."
  vendorUrl: "https://growingspaces.com/"
  sources: ["https://growingspaces.com/geodesic-dome-greenhouse/high-quality-polycarbonate-greenhouse/"]

- id: glass-geodesic
  name: Glass geodesic
  family: glazed
  costPerSqFt: "Quote the glazing, structure, installation and climate systems"
  insulation: "Depends on glazing units, coatings, frame and proportion of glass"
  diy: low
  light: transparent
  durability: "Detail safety glazing, seals and access for replacement"
  bestUse: "A transparent space with a serious comfort strategy"
  pros:
    - "Clear views and a close visual relationship with the surroundings"
    - "Specialist suppliers offer geodesic glass enclosures"
  cons:
    - "Solar gain, glare, heat loss and privacy need attention"
    - "High or sloping glazing complicates cleaning and repair"
  caveats:
    - "Avoid ranking all glass as one material. Ask for the specified glazing and a climate-specific assessment of the complete building."
  vendorUrl: "https://biodomes.org/"
  sources: ["https://biodomes.org/"]

- id: binishell
  name: Binishell (air-formed concrete)
  family: concrete
  costPerSqFt: "Request a project-specific proposal; prototype prices do not transfer"
  insulation: "A concrete shell still needs an envelope strategy"
  diy: low
  light: opaque
  durability: "System generation, engineering and construction quality matter"
  bestUse: "Exploring specialist concrete-shell construction"
  pros:
    - "Uses pneumatic forming to produce curved concrete structures"
    - "Offers a different construction route from a geodesic kit"
  cons:
    - "Requires specialist design and delivery capability"
    - "Rapid shell forming does not describe total project duration"
  caveats:
    - "Ask which specific system and completed comparable projects a proposal refers to. Do not equate different generations of the technology."
  vendorUrl: "https://binishells.com/"
  sources: ["https://binishells.com/"]

- id: bioceramic-geoship
  name: Bioceramic panels (Geoship)
  family: ceramic
  costPerSqFt: "Confirm current scope, delivery terms and site costs directly"
  insulation: "Request test reports for the supplied assembly"
  diy: low
  light: opaque
  durability: "Check documented performance and warranty conditions"
  bestUse: "Investigating a newer prefabricated material system"
  pros:
